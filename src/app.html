<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			Static head defaults. Page-specific overrides (title / description /
			og:image) are injected per-route via <svelte:head> in the layout
			and individual +page.svelte files.

			The accent-color system swaps both the SVG favicon and theme-color
			at runtime in Color.svelte — the values below are first-paint
			defaults (the common blue accent) so SSR isn't flash-of-white.
		-->
		<meta
			name="description"
			content="時代に流されることのない普遍性と、未来を切り拓く革新性が共存するヴィジュアルコミュニケーションを、創造し続けます。"
		/>
		<meta name="theme-color" content="#100088" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Open Graph / Facebook / LINE -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="one inc." />
		<meta property="og:locale" content="ja_JP" />
		<meta
			property="og:description"
			content="時代に流されることのない普遍性と、未来を切り拓く革新性が共存するヴィジュアルコミュニケーションを、創造し続けます。"
		/>

		<!-- Twitter / X (cards still render even though one inc. has no handle) -->
		<meta name="twitter:card" content="summary_large_image" />

		<!-- FOUT guard for the very first paint: keep the body invisible until
		     FontPlus signals the subset has rendered. Capped at 1500 ms so a
		     blocked/slow font request can never lock the page. -->
		<style>
			html:not(.fonts-ready) body { opacity: 0; }
			body { transition: opacity 0.25s ease; }
		</style>
		<script>
			(function () {
				var done = false;
				function ready() {
					if (done) return;
					done = true;
					document.documentElement.classList.add('fonts-ready');
				}
				// Safety: reveal after 1500 ms regardless.
				setTimeout(ready, 1500);

				// Poll for FONTPLUS until the script lands, then attach completion.
				function tryAttach() {
					if (window.FONTPLUS && typeof window.FONTPLUS.attachCompleteEvent === 'function') {
						try { window.FONTPLUS.attachCompleteEvent(ready); } catch (e) { /* ignore */ }
						return true;
					}
					return false;
				}
				if (!tryAttach()) {
					var poll = setInterval(function () {
						if (tryAttach()) clearInterval(poll);
					}, 30);
					setTimeout(function () { clearInterval(poll); }, 1500);
				}
			})();
		</script>
		<script src="https://webfont.fontplus.jp/accessor/script/fontplus.js?kqbwQX--jVA%3D&box=Bgw26CBfLFk%3D&aa=1&ab=2"></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
